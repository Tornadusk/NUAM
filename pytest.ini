[pytest]
# Usar configuración específica para tests (SQLite en lugar de Oracle)
DJANGO_SETTINGS_MODULE = pytest_settings
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    --reuse-db
testpaths = .

