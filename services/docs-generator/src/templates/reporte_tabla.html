<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 30px; }
        h1 { color: #d32f2f; text-align: center; }
        .meta { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
        th { background-color: #f2f2f2; padding: 8px; border: 1px solid #ddd; text-align: left; }
        td { padding: 6px; border: 1px solid #ddd; }
        .footer { margin-top: 30px; font-size: 10px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="meta">
        <h1>{{ titulo }}</h1>
        <p><strong>Fecha:</strong> {{ fecha }} | <strong>Generado por:</strong> {{ generado_por }}</p>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.columna1 }}</td>
                <td>{{ item.columna2 }}</td>
                <td>{{ item.columna3 }}</td>
                <td>{{ item.columna4 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="footer">
        Documento generado automáticamente por NUAM Docs Service.
    </div>
</body>
</html>
