services:
  # Apache Pulsar Standalone
  pulsar:
    image: apachepulsar/pulsar:3.2.0
    container_name: nuam-pulsar
    ports:
      - "6650:6650"    # Puerto Pulsar (productores/consumidores)
      - "8080:8080"    # Puerto Pulsar Admin (RPC)
    command: bin/pulsar standalone
    environment:
      # Configuración de memoria para evitar OutOfMemoryError
      # IMPORTANTE: No usar comillas dentro del valor - Docker Compose ya maneja las comillas
      - PULSAR_MEM=-Xms512m -Xmx1024m -XX:MaxDirectMemorySize=512m
    volumes:
      - pulsar-data:/pulsar/data
      - pulsar-conf:/pulsar/conf
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 30s      # Aumentado para dar más tiempo de inicio
      timeout: 10s
      retries: 10
      start_period: 60s  # Esperar 60 segundos antes de empezar health checks
    mem_limit: 2g        # Límite de memoria para el contenedor
    mem_reservation: 1g  # Reserva mínima de memoria
    restart: unless-stopped  # Reiniciar automáticamente si se cae
    networks:
      - nuam-network

  # Generador de Documentos (microservicio FastAPI)
  docs-generator:
    build: ./services/docs-generator
    container_name: nuam-docs-generator
    ports:
      - "5001:5000"
    volumes:
      - ./services/docs-generator/src:/app/src
    restart: unless-stopped  # Reiniciar automáticamente si se cae
    networks:
      - nuam-network
    depends_on:
      - pulsar  # Asegurar que Pulsar inicie primero (opcional, no crítico)

volumes:
  pulsar-data:
    driver: local
  pulsar-conf:
    driver: local

networks:
  nuam-network:
    driver: bridge
